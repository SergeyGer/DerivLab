name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.10 · lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests with coverage
        run: |
          python -m pytest -q \
            --cov=derivlab \
            --cov-report=term \
            --cov-report=xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=80
      - name: Verify coverage badge
        timeout-minutes: 2
        run: python scripts/update_coverage_badge.py --check
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error

  docker:
    name: Docker image and health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t derivlab:ci .
      - name: Smoke test container
        run: |
          docker run -d --name derivlab-ci -p 8501:8501 derivlab:ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs derivlab-ci
          exit 1
      - name: Show restart policy
        if: always()
        run: docker inspect derivlab-ci --format '{{.HostConfig.RestartPolicy.Name}}'
      - name: Cleanup
        if: always()
        run: docker rm -f derivlab-ci || true
