[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:streamlit",
    "ignore::DeprecationWarning:backtrader.*",
    "ignore::FutureWarning:yfinance",
]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".venv", "data", "docs", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.coverage.run]
source = ["derivlab"]
omit = ["tests/*"]
